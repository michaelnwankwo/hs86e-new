# =============================================================================
# Netlify configuration — HS86E Tickets (Next.js 15 App Router)
#
# The Next.js application lives in the `hs86e-tickets/` subdirectory of this
# repository, so `base` points there. Everything else is standard Next.js on
# Netlify: `npm run build` produces `.next`, and the official Next.js Runtime
# serves SSR pages, API routes, and middleware as on-demand functions.
# =============================================================================

[build]
  base = "hs86e-tickets"
  command = "npm run build"
  # Next.js output directory — the Netlify Next.js Runtime takes it from here.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Official Next.js Runtime. Netlify auto-installs it when it detects Next.js;
# it is pinned here so the setting is explicit and reviewable.
[[plugins]]
  package = "@netlify/plugin-nextjs"
